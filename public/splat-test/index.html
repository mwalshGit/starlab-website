<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaussian Splat Diagnostic</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; }
    canvas { display:block; width:100%; height:100%; }
    #status { position:fixed; z-index:10; top:12px; left:12px; padding:8px 10px; background:rgba(0,0,0,.7); color:white; border-radius:6px; font:14px Arial,sans-serif; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas/+esm"
    }
  }
  </script>
</head>
<body>
  <div id="status">Loading PlayCanvas test…</div>
  <script type="module">
    import { Application, Asset, AssetListLoader, Entity, FILLMODE_FILL_WINDOW, RESOLUTION_AUTO } from 'playcanvas';

    const status = document.getElementById('status');
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);

    const app = new Application(canvas, { graphicsDeviceOptions: { antialias: false } });
    app.setCanvasFillMode(FILLMODE_FILL_WINDOW);
    app.setCanvasResolution(RESOLUTION_AUTO);
    app.start();
    window.addEventListener('resize', () => app.resizeCanvas());

    const cameraScript = new Asset('camera-controls', 'script', {
      url: 'https://cdn.jsdelivr.net/npm/playcanvas/scripts/esm/camera-controls.mjs'
    });
    const toy = new Asset('toy', 'gsplat', {
      url: 'https://developer.playcanvas.com/assets/toy-cat.sog'
    });
    const priests = new Asset('priests', 'gsplat', {
      url: '/splat-test/priests_deg0.sog'
    });

    const assets = [cameraScript, toy, priests];
    const loader = new AssetListLoader(assets, app.assets);

    loader.load(() => {
      status.textContent = 'Loaded: PlayCanvas toy + priests SOG';

      const camera = new Entity('Camera');
      camera.setPosition(0, 0, 4.5);
      camera.addComponent('camera', { clearColor: [0.72, 0.72, 0.72, 1] });
      camera.addComponent('script');
      camera.script.create('cameraControls');
      app.root.addChild(camera);

      const cat = new Entity('Toy Cat');
      cat.setPosition(-1.0, -0.7, 0);
      cat.setEulerAngles(0, 0, 180);
      cat.addComponent('gsplat', { asset: toy });
      app.root.addChild(cat);

      const p = new Entity('Priests');
      p.setPosition(1.0, 0, 0);
      p.addComponent('gsplat', { asset: priests });
      app.root.addChild(p);
    }, (err) => {
      status.textContent = 'LOAD ERROR: ' + String(err);
      console.error(err);
    });
  </script>
</body>
</html>
