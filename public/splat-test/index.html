<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priests Gaussian Splat Test</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      border-radius: 6px;
      font: 14px Arial, sans-serif;
      max-width: 700px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas/+esm"
    }
  }
  </script>
</head>

<body>
  <div id="status">Loading priests SOG…</div>

  <script type="module">
    import {
      Application,
      Asset,
      AssetListLoader,
      Entity,
      FILLMODE_FILL_WINDOW,
      RESOLUTION_AUTO
    } from 'playcanvas';

    const status = document.getElementById('status');

    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);

    const app = new Application(canvas, {
      graphicsDeviceOptions: { antialias: false }
    });

    app.setCanvasFillMode(FILLMODE_FILL_WINDOW);
    app.setCanvasResolution(RESOLUTION_AUTO);
    app.start();

    window.addEventListener('resize', () => app.resizeCanvas());

    const priests = new Asset('priests', 'gsplat', {
      url: '/splat-test/priests_deg0.sog'
    });

    const loader = new AssetListLoader([priests], app.assets);

    loader.load(() => {
      try {
        const aabb = priests.resource.aabb;
        const c = aabb.center;
        const h = aabb.halfExtents;

        const maxHalfExtent = Math.max(h.x, h.y, h.z);
        const cameraDistance = Math.max(maxHalfExtent * 3.0, 2.0);

        status.textContent =
          `Loaded priests | center ${c.x.toFixed(2)}, ${c.y.toFixed(2)}, ${c.z.toFixed(2)} | ` +
          `size ${(h.x * 2).toFixed(2)} × ${(h.y * 2).toFixed(2)} × ${(h.z * 2).toFixed(2)}`;

        const splat = new Entity('Priests');
        splat.setPosition(-c.x, -c.y, -c.z);
        splat.addComponent('gsplat', { asset: priests });
        app.root.addChild(splat);

        const camera = new Entity('Camera');
        camera.setPosition(0, 0, cameraDistance);
        camera.addComponent('camera', {
          clearColor: [0.72, 0.72, 0.72, 1]
        });
        camera.lookAt(0, 0, 0);
        app.root.addChild(camera);

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const pos = camera.getPosition();
          const factor = e.deltaY > 0 ? 1.12 : 0.88;
          camera.setPosition(
            pos.x,
            pos.y,
            Math.max(0.1, pos.z * factor)
          );
          camera.lookAt(0, 0, 0);
        }, { passive: false });

      } catch (err) {
        status.textContent = 'FRAME ERROR: ' + String(err);
        console.error(err);
      }
    }, (err) => {
      status.textContent = 'LOAD ERROR: ' + String(err);
      console.error(err);
    });
  </script>
</body>
</html>
