<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Priests Gaussian Splat Test</title>

  <script type="importmap">
  {
    "imports": {
      "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@latest/build/playcanvas.mjs",
      "@playcanvas/web-components": "https://cdn.jsdelivr.net/npm/@playcanvas/web-components@latest/dist/pwc.min.mjs"
    }
  }
  </script>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@playcanvas/web-components@latest/dist/pwc.min.mjs"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    pc-app { width: 100%; height: 100vh; height: 100dvh; display: block; }
    .label, .status {
      position: fixed;
      left: 12px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,.65);
      padding: 8px 10px;
      border-radius: 6px;
      font: 14px/1.2 Arial, sans-serif;
    }
    .label { top: 12px; }
    .status { top: 52px; max-width: 520px; }
  </style>
</head>
<body>
  <div class="label">Priests Gaussian Splat Test</div>
  <div class="status" id="status">Checking SOG…</div>

  <pc-app antialias="false" max-pixel-ratio="1">
    <pc-asset src="https://cdn.jsdelivr.net/npm/playcanvas/scripts/esm/camera-controls.mjs"></pc-asset>
    <pc-asset id="priests" src="/splat-test/priests_deg0.sog"></pc-asset>

    <pc-scene>
      <pc-entity position="0 0 9">
        <pc-camera></pc-camera>
        <pc-script>
          <pc-script-instance name="cameraControls"></pc-script-instance>
        </pc-script>
      </pc-entity>

      <pc-entity position="-1.297 3.705 1.689" scale="1 1 1">
        <pc-gsplat asset="priests"></pc-gsplat>
      </pc-entity>
    </pc-scene>
  </pc-app>

  <script>
    (async () => {
      const el = document.getElementById('status');
      const url = '/splat-test/priests_deg0.sog';
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) {
          el.textContent = `SOG fetch failed: HTTP ${r.status} ${r.statusText}`;
          return;
        }
        const b = await r.blob();
        el.textContent = `SOG fetched OK: ${(b.size / 1024 / 1024).toFixed(2)} MB | centered for test`;
      } catch (err) {
        el.textContent = `SOG fetch error: ${err.message}`;
      }
    })();
  </script>
</body>
</html>
