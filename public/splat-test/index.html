<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priests Gaussian Splat Test</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      padding: 8px 10px;
      background: rgba(0,0,0,.7);
      color: #fff;
      border-radius: 6px;
      font: 14px Arial, sans-serif;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas/+esm"
    }
  }
  </script>
</head>

<body>
  <div id="status">Loading priests…</div>

  <script type="module">
    import {
      Application,
      Asset,
      AssetListLoader,
      Entity,
      FILLMODE_FILL_WINDOW,
      RESOLUTION_AUTO
    } from 'playcanvas';

    const status = document.getElementById('status');

    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);

    const app = new Application(canvas, {
      graphicsDeviceOptions: { antialias: false }
    });

    app.setCanvasFillMode(FILLMODE_FILL_WINDOW);
    app.setCanvasResolution(RESOLUTION_AUTO);
    app.start();

    window.addEventListener('resize', () => app.resizeCanvas());

    const priests = new Asset('priests', 'gsplat', {
      url: '/splat-test/priests_deg0.sog'
    });

    const loader = new AssetListLoader([priests], app.assets);

    loader.load(() => {
      try {
        const aabb = priests.resource.aabb;
        const c = aabb.center;
        const h = aabb.halfExtents;

        // Leave the splat exactly where it is.
        const splat = new Entity('Priests');
        splat.addComponent('gsplat', { asset: priests });
        app.root.addChild(splat);

        // Frame the camera around the splat's ACTUAL center instead of moving the splat.
        const radius = Math.sqrt(h.x*h.x + h.y*h.y + h.z*h.z);
        const distance = Math.max(radius * 1.35, 10);

        const camera = new Entity('Camera');
        camera.setPosition(c.x, c.y, c.z + distance);
        camera.addComponent('camera', {
          clearColor: [0.72, 0.72, 0.72, 1],
          nearClip: 0.01,
          farClip: Math.max(distance * 10, 10000),
          fov: 55
        });
        camera.lookAt(c.x, c.y, c.z);
        app.root.addChild(camera);

        status.textContent =
          `Loaded priests | center ${c.x.toFixed(2)}, ${c.y.toFixed(2)}, ${c.z.toFixed(2)} | scroll to zoom`;

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();

          const pos = camera.getPosition();
          const dx = pos.x - c.x;
          const dy = pos.y - c.y;
          const dz = pos.z - c.z;

          const factor = e.deltaY > 0 ? 1.12 : 0.88;

          camera.setPosition(
            c.x + dx * factor,
            c.y + dy * factor,
            c.z + dz * factor
          );

          camera.lookAt(c.x, c.y, c.z);
        }, { passive: false });

      } catch (err) {
        status.textContent = 'FRAME ERROR: ' + String(err);
        console.error(err);
      }
    }, (err) => {
      status.textContent = 'LOAD ERROR: ' + String(err);
      console.error(err);
    });
  </script>
</body>
</html>
